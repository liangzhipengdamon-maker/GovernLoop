name: TEMP patch full response readback

on:
  push:
    branches: [fix/cli-full-response-readback]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[full-response-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cli-full-response-readback
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch checkpoint stdout readback and skill guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('skills/workbuddy/governloop/scripts/governloop_session.py')
          s = p.read_text()
          old = '''    summary = (\n        f"CHECKPOINT: {ctype}\\nSESSION: {state['session_id']}\\n"\n        f"TEXT_RELAY: PASS\\n{attrs_note}\\n"\n        f"RESPONSE (head): {response[:400]!r}"\n    )\n'''
          new = '''    # Full readback is part of the stable CLI boundary. The relay keeps the\n    # canonical response file as internal evidence, but agents must not need to\n    # open that temp file (which may cross their sandbox boundary) just to read\n    # the assistant reply. Emit the complete response on stdout instead.\n    summary = (\n        f"CHECKPOINT: {ctype}\\nSESSION: {state['session_id']}\\n"\n        f"TEXT_RELAY: PASS\\n{attrs_note}\\n"\n        "RESPONSE_BEGIN\\n"\n        f"{response}"\n        "\\nRESPONSE_END"\n    )\n'''
          if old not in s:
              raise SystemExit('expected checkpoint summary block not found')
          p.write_text(s.replace(old, new, 1))

          skill = Path('skills/workbuddy/governloop/SKILL.md')
          t = skill.read_text()
          needle = '''The second form is used by ChatGPT Project/custom-GPT conversation pages. Keep\nthe full URL intact; do not rewrite it to `/c/<id>` before binding. If the CLI\nrejects a URL, surface its actual error instead of inventing an older workaround.\n'''
          replacement = needle + '''\n## Checkpoint response readback\n\nTreat the `governloop checkpoint` command's stdout as the normal readback\nboundary. On success it prints the complete assistant reply between\n`RESPONSE_BEGIN` and `RESPONSE_END`. Consume that text directly. Do **not** open\n`/tmp/governloop-response-*` or other GovernLoop temp files merely to obtain the\nreply; those files are internal evidence/state and may cross the agent sandbox\nboundary.\n'''
          if needle not in t:
              raise SystemExit('expected skill URL guidance block not found')
          skill.write_text(t.replace(needle, replacement, 1))
          PY
      - name: Run focused tests
        run: python3 -m unittest tests.test_full_response_readback
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/workbuddy/governloop/scripts/governloop_session.py skills/workbuddy/governloop/SKILL.md
          git commit -m "fix: emit full checkpoint response on stdout [full-response-patch]"
          git push origin HEAD:fix/cli-full-response-readback
