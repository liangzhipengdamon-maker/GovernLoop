name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install relay test dependency
        run: python3 -m pip install websockets
      - name: Relay + session-manager tests
        run: python3 -m unittest discover -s tools/neutral-relay/tests
      - name: ChatGPT Project conversation URL tests
        run: python3 -m unittest tests.test_chatgpt_project_conversation_url

  installer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Agent skill installer tests
        run: python3 -m unittest tests.test_install_agent_skills
