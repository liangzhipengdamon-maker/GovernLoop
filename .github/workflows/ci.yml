name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Relay + session-manager tests
        run: python3 -m unittest discover -s tools/neutral-relay/tests
      - name: Installer + scripts tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
